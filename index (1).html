<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000000"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Zaso Wallet"><meta name="mobile-web-app-capable" content="yes"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" type="image/png" href="./logo.png"><link rel="apple-touch-icon" href="./logo.png"><title>Zaso Wallet Preview</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#000;color:#eee;font-family:Arial,Helvetica,sans-serif}button,input{font:inherit}button{cursor:pointer} .app{width:100%;max-width:430px;min-height:100dvh;margin:auto;background:#000;position:relative;padding-bottom:calc(72px + env(safe-area-inset-bottom))}.top{height:58px;border-bottom:1px solid #242424;display:flex;align-items:center;padding:0 13px;gap:10px}.avatar{height:32px;width:32px;flex:none;border-radius:50%;background:linear-gradient(140deg,#8bb7ff,#b89aff);display:grid;place-items:center;font-size:20px}.identity{display:flex;flex-direction:column;line-height:19px;min-width:0}.identity b{font-size:14px;color:#f1f1f1}.identity small{font-size:14px;font-weight:bold;color:#fff}.copy{background:none;border:0;color:#a6a6a6;padding:0;margin-left:0}.top-actions{margin-left:auto;display:flex;align-items:center;gap:18px}.iconbtn{background:transparent;border:0;color:#aaa;display:grid;place-items:center;padding:0}.iconbtn svg,.copy svg,.nav svg{width:19px;height:19px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}.balance{padding-top:29px;text-align:center}.balance .amount{cursor:default;font-family:Arial,Helvetica,sans-serif;font-size:50px;font-weight:700;letter-spacing:-1.5px;line-height:1.12;color:white}.change{color:#999;display:flex;align-items:center;justify-content:center;gap:10px;margin-top:1px;font-size:20px;color:#ff1547}.percent{background:#161616;border-radius:8px;padding:3px 7px;font-size:19px}.watch{margin:30px 9px 0 16px;background:#101010;border:0;border-radius:22px;width:calc(100% - 25px);height:51px;display:flex;align-items:center;justify-content:center;gap:9px;color:#c4c4c4;font-size:14px;font-weight:600}.watch svg{width:19px;height:19px;stroke:#aaa;fill:none;stroke-width:1.8}.tabs{display:flex;align-items:center;gap:14px;margin:32px 16px 8px;height:24px}.tab{background:none;border:0;padding:0;color:#aaa;font-size:20px;font-weight:600;letter-spacing:-.5px}.tab.active{color:#fff}.more{margin-left:auto;background:none;border:0;color:#aaa;font-size:22px;letter-spacing:2px;line-height:1}.tokens{padding:0 9px 0 16px}.token{width:100%;height:65px;background:#1e1e1e;border:0;border-radius:22px;display:flex;align-items:center;text-align:left;padding:0 17px 0 19px;color:#eee;margin-bottom:9px;gap:12px}.coin{height:40px;width:40px;border-radius:50%;flex:none;display:grid;place-items:center;position:relative;font-size:27px;font-weight:900}.coin.sol{background:#050505;overflow:hidden}.coin.sol i{width:26px;height:5px;border-radius:2px;display:block;transform:skew(-25deg);background:linear-gradient(90deg,#8d50fb,#35e4a3);margin:3px 0}.coin.jito{background:#4dba78;border:2px solid #b6f0b8;box-shadow:inset 0 0 0 3px #4dba78, inset 0 0 0 5px #dcffe5;color:#fff;font-size:25px}.coin.steak{background:#34343a;font-size:25px}.coin.blaze{background:#090909;font-size:23px}.tiny{position:absolute;bottom:-3px;right:-5px;background:#f6f6f6;color:#161616;border:2px solid #222;border-radius:50%;font-size:11px;width:19px;height:19px;display:grid;place-items:center}.token-main{min-width:0;flex:1}.token-name{font-size:18px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.verified{font-size:14px;color:#a88df5}.token-sub{font-size:14px;color:#aaa;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.token-value{text-align:right;min-width:98px}.usd{font-size:18px;font-weight:600;white-space:nowrap}.loss{color:#ff1649;font-size:14px;margin-top:5px;white-space:nowrap}.nav{height:calc(62px + env(safe-area-inset-bottom));position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:430px;width:100%;background:#000;border-top:1px solid #1e1e1e;display:flex;align-items:center;justify-content:space-around;padding-bottom:env(safe-area-inset-bottom)}.nav button{background:none;border:0;color:#888;padding:10px 20px}.nav button.active{color:#a78bfa}.nav svg{width:24px;height:24px}.nav button.active svg.home{fill:#a78bfa;stroke:#a78bfa}.overlay{position:fixed;inset:0;background:#000b;display:none;align-items:flex-end;justify-content:center;z-index:10}.overlay.open{display:flex}.sheet{background:#1c1c1e;border-radius:24px 24px 0 0;padding:20px;width:min(430px,100%);min-height:220px;box-shadow:0 -10px 50px #0008}.sheet-head{display:flex;justify-content:space-between;align-items:center}.sheet-head h2{margin:0;font-size:20px}.sheet-head button{background:none;border:0;color:#aaa;font-size:27px}.sheet p{color:#aaa;line-height:1.5}.sheet label{display:block;color:#aaa;font-size:13px;margin:10px 0 5px}.sheet select{background:#2a2a2d;color:white;border:1px solid #444;border-radius:10px;padding:11px;width:100%}.sheet input{background:#2a2a2d;color:white;border:1px solid #444;border-radius:10px;padding:11px;width:100%}.secondary{background:#303034;color:#fff;border:0;border-radius:12px;padding:12px 18px;margin-top:10px;width:100%;font-weight:700}.sheet .hint{font-size:12px;color:#999}.primary{background:#a78bfa;color:#111;border:0;border-radius:12px;padding:12px 18px;margin-top:14px;width:100%;font-weight:700}.demo{font-size:10px;color:#777;text-align:center;padding:12px 0}.searchbar{display:none;margin:12px 16px}.searchbar.open{display:block}.searchbar input{background:#171717;border:1px solid #333;border-radius:13px;color:white;width:100%;padding:12px}.empty{padding:32px;text-align:center;color:#999}.toast{position:fixed;bottom:82px;left:50%;transform:translateX(-50%);background:#2a2a2a;color:white;padding:10px 18px;border-radius:12px;display:none;white-space:nowrap;font-size:13px;z-index:20}@media(max-width:365px){.balance .amount{font-size:46px}.token{padding-right:17px;gap:10px}.token-name{font-size:17px}}
</style></head><body><div class="app"><header class="top"><div class="avatar">🐟</div><div class="identity"><b>@zasolos</b><small>zaso</small></div><button class="copy" id="copy" aria-label="Copy demo address"><svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg></button><div class="top-actions"><button class="iconbtn" id="edit" aria-label="Add cryptocurrency"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="13" rx="3"/><path d="M10 21h4"/></svg></button><button class="iconbtn" id="searchBtn" aria-label="Search"><svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.5"/><path d="m16 16 4.5 4.5"/></svg></button><button class="iconbtn" id="menu" aria-label="Menu"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M10 4v16m4-12v8"/></svg></button></div></header><main><section class="balance"><div class="amount" id="total">$0.00</div><div class="change"><span id="change">$0.00</span><span class="percent" id="percent">0.00%</span></div></section><div class="tabs"><button class="tab active" data-tab="tokens">Tokens</button><button class="tab" data-tab="collectibles">Collectibles</button><button class="more" id="more">•••</button></div><div class="searchbar" id="searchbar"><input id="search" placeholder="Search tokens" autocomplete="off"></div><div class="tokens" id="list"></div></main><nav class="nav"><button class="active" data-nav="home" aria-label="Home"><svg class="home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/></svg></button><button data-nav="activity" aria-label="Activity"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 2"/></svg></button><button data-nav="explore" aria-label="Explore"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="8"/><path d="m17 17 5 5"/></svg></button></nav></div><div class="overlay" id="overlay"><div class="sheet"><div class="sheet-head"><h2 id="sheetTitle">Details</h2><button id="close" aria-label="Close">×</button></div><div id="sheetBody"></div></div></div><div class="toast" id="toast"></div><script>
const assetBase='https://cdn.jsdelivr.net/gh/trustwallet/assets@master/blockchains/';
const defaultCoins=[
{name:'Bitcoin',full:'Bitcoin',symbol:'BTC',qty:'0',usd:0,loss:'Approx. price · fixed',type:'custom',image:assetBase+'bitcoin/info/logo.png',priceId:'bitcoin'},
{name:'Solana',full:'Solana',symbol:'SOL',qty:'0',usd:0,loss:'Approx. price · fixed',type:'custom',image:assetBase+'solana/info/logo.png',priceId:'solana'},
{name:'Litecoin',full:'Litecoin',symbol:'LTC',qty:'0',usd:0,loss:'Approx. price · fixed',type:'custom',image:assetBase+'litecoin/info/logo.png',priceId:'litecoin'},
{name:'Ethereum',full:'Ethereum',symbol:'ETH',qty:'0',usd:0,loss:'Approx. price · fixed',type:'custom',image:assetBase+'ethereum/info/logo.png',priceId:'ethereum'}
];
let coins=JSON.parse(localStorage.getItem('zasoCoinsV2')||'null')||defaultCoins;
let demoChange=Number(localStorage.getItem('zasoDemoChange')??283);
let demoPercent=Number(localStorage.getItem('zasoDemoPercent')??8.23);
let currentTab='tokens';const $=id=>document.getElementById(id),fmt=n=>'$'+Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
function updateSummary(){
 const sum=coins.reduce((n,c)=>n+(Number(c.usd)||0),0);
 const total=Math.max(0,sum);
 $('total').textContent=fmt(total);
 const up=demoChange>=0;
 $('change').textContent=(up?'+':'-')+fmt(Math.abs(demoChange));
 $('percent').textContent=(demoPercent>=0?'+':'')+demoPercent.toFixed(2)+'%';
 $('change').style.color=up?'#21c978':'#ff1547';
 $('percent').style.color=demoPercent>=0?'#21c978':'#ff1547';
 $('percent').style.background=demoPercent>=0?'#103322':'#161616';
}
function logo(c){if(c.type==='custom')return '<div class="coin" style="background:#24242b;overflow:hidden">'+(c.image?'<img alt="" src="'+c.image+'" style="width:100%;height:100%;object-fit:cover">':'🪙')+'</div>';if(c.type==='sol')return '<div class="coin sol"><img alt="Solana" src="https://cdn.jsdelivr.net/gh/trustwallet/assets@master/blockchains/solana/info/logo.png" style="width:39px;height:39px;border-radius:50%;object-fit:cover" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'block\'"><svg style="display:none;position:absolute;width:30px;height:30px" viewBox="0 0 397.7 311.7" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="solgrad" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#9945FF"/><stop offset="1" stop-color="#14F195"/></linearGradient></defs><g fill="url(#solgrad)"><path d="M64.6 237.9a12.8 12.8 0 0 1 9-3.7h310.9c5.7 0 8.6 6.9 4.6 10.9l-61.4 61.4a12.8 12.8 0 0 1-9 3.7H3.2c-5.7 0-8.6-6.9-4.6-10.9z"/><path d="M64.6 3.7a12.8 12.8 0 0 1 9-3.7h310.9c5.7 0 8.6 6.9 4.6 10.9l-61.4 61.4a12.8 12.8 0 0 1-9 3.7H3.2c-5.7 0-8.6-6.9-4.6-10.9z"/><path d="M323.1 120.8a12.8 12.8 0 0 0-9-3.7H3.2c-5.7 0-8.6 6.9-4.6 10.9l61.4 61.4a12.8 12.8 0 0 0 9 3.7h310.9c5.7 0 8.6-6.9 4.6-10.9z"/></g></svg></div>';if(c.type==='jito')return '<div class="coin jito">≋<span class="tiny">▤</span></div>';if(c.type==='steak')return '<div class="coin steak">🥩<span class="tiny">▤</span></div>';return '<div class="coin blaze">🔥</div>'}function persist(){localStorage.setItem('zasoCoinsV2',JSON.stringify(coins));updateSummary()}function render(filter=''){updateSummary();let el=$('list');if(currentTab==='collectibles'){el.innerHTML='<div class="empty">No collectibles in this demo wallet.</div>';return}let items=coins.filter(c=>(c.full+' '+c.symbol).toLowerCase().includes(filter.toLowerCase()));el.innerHTML=items.length?items.map((c)=>`<button class="token" data-coin="${coins.indexOf(c)}">${logo(c)}<div class="token-main"><div class="token-name">${c.name} ${c.verified?'<span class="verified">✿</span>':''}</div><div class="token-sub">${c.qty} ${c.symbol}</div></div><div class="token-value"><div class="usd">${fmt(c.usd)}</div><div class="loss" style="color:#aaa">${c.qty}</div></div></button>`).join(''):'<div class="empty">No tokens found</div>';el.querySelectorAll('[data-coin]').forEach(b=>b.onclick=()=>{let c=coins[+b.dataset.coin];show(c.full,`<p>Demo balance</p><h2>${fmt(c.usd)}</h2><p>${c.qty} ${c.symbol}</p><p>Market data: <span style="color:#aaa">${c.price?fmt(c.price)+" per "+c.symbol:c.loss}</span></p><button class="secondary" data-editcoin="${coins.indexOf(c)}">Edit token</button>`)});}function show(title,body){$('sheetTitle').textContent=title;$('sheetBody').innerHTML=body;$('overlay').classList.add('open')}function toast(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',1800)}$('close').onclick=()=>$('overlay').classList.remove('open');$('overlay').onclick=e=>{if(e.target===$('overlay'))$('overlay').classList.remove('open')};$('copy').onclick=()=>{navigator.clipboard?.writeText('DEMO-WALLET-NOT-A-REAL-ADDRESS').catch(()=>{});toast('Demo address copied')};function addCoin(){show('Add cryptocurrency',`<p class="hint">Choose a token or create your own. All values are simulated.</p><label>Cryptocurrency</label><select id="coinPreset"><option value="">Custom coin</option><option value="Bitcoin|BTC|https://cdn.jsdelivr.net/gh/trustwallet/assets@master/blockchains/bitcoin/info/logo.png">Bitcoin (BTC)</option><option value="Litecoin|LTC|https://cdn.jsdelivr.net/gh/trustwallet/assets@master/blockchains/litecoin/info/logo.png">Litecoin (LTC)</option><option value="Ethereum|ETH|https://cdn.jsdelivr.net/gh/trustwallet/assets@master/blockchains/ethereum/info/logo.png">Ethereum (ETH)</option><option value="Solana|SOL|https://cdn.jsdelivr.net/gh/trustwallet/assets@master/blockchains/solana/info/logo.png">Solana (SOL)</option><option value="USDC|USDC|https://cdn.jsdelivr.net/gh/trustwallet/assets@master/blockchains/solana/assets/EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v/logo.png">USDC</option><option value="Tether|USDT|https://cdn.jsdelivr.net/gh/trustwallet/assets@master/blockchains/ethereum/assets/0xdAC17F958D2ee523a2206206994597C13D831ec7/logo.png">Tether (USDT)</option><option value="Jupiter|JUP|https://static.jup.ag/jup/icon.png">Jupiter (JUP)</option></select><label>Coin name</label><input id="coinName" maxlength="42" placeholder="e.g. My Token"><label>Symbol</label><input id="coinSymbol" maxlength="12" placeholder="e.g. MYT"><label>Image URL (optional)</label><input id="coinImage" placeholder="https://..."><label>Or upload coin image</label><input id="coinUpload" type="file" accept="image/*"><label>Token quantity</label><input id="coinQty" type="number" min="0" step="any" value="1"><label>USD balance</label><input id="coinUSD" type="number" min="0" step="0.01" value="0"><button class="primary" id="saveCoin">Add coin</button>`)}
$('total').style.cursor='default';
$('edit').onclick=addCoin;
$('menu').onclick=$('more').onclick=()=>show('Wallet options','<p class="hint">Demo wallet — simulated values, not real funds.</p><button class="primary" id="openAdd">Add cryptocurrency</button>');
$('searchBtn').onclick=()=>{$('searchbar').classList.toggle('open');$('search').focus()};$('search').oninput=e=>render(e.target.value);document.addEventListener('change',e=>{if(e.target.id==='coinPreset'&&e.target.value){let [name,symbol,img]=e.target.value.split('|');$('coinName').value=name;$('coinSymbol').value=symbol;$('coinImage').value=img}});
document.addEventListener('click',async e=>{let id=e.target.id;if(id==='openAdd')addCoin();if(id==='saveCoin'){let name=$('coinName').value.trim(),symbol=$('coinSymbol').value.trim().toUpperCase(),qty=Number($('coinQty').value),usd=Number($('coinUSD').value);if(!name||!symbol||!Number.isFinite(qty)||qty<0||!Number.isFinite(usd)||usd<0){toast('Enter valid coin details');return}let img=$('coinImage').value.trim(),file=$('coinUpload').files[0];if(file){if(file.size>700000){toast('Image must be under 700 KB');return}img=await new Promise(resolve=>{let reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.readAsDataURL(file)})}if(img&&!(/^(https:\/\/|data:image\/)/i.test(img))){toast('Use a secure image URL');return}coins.push({name,full:name,symbol,qty:String(qty),usd,loss:'$0.00',type:'custom',image:img});try{persist()}catch(err){coins.pop();toast('Image too large to save');return}currentTab='tokens';document.querySelector('[data-tab="tokens"]').click();$('overlay').classList.remove('open');toast('Coin added')}let btn=e.target.closest('[data-editcoin]');if(btn){let i=Number(btn.dataset.editcoin),c=coins[i];show('Edit '+c.full,`<label>Token quantity</label><input id="editQty" type="number" min="0" step="any" value="${Number(c.qty.replaceAll(',',''))||0}"><label>USD balance</label><input id="editUSD" type="number" min="0" step="0.01" value="${c.usd}"><button class="primary" id="saveEdit" data-index="${i}">Save changes</button><button class="secondary" id="deleteCoin" data-index="${i}">Remove token</button>`)}if(id==='saveEdit'){let i=Number(e.target.dataset.index),q=Number($('editQty').value),u=Number($('editUSD').value);if(q>=0&&u>=0&&Number.isFinite(q)&&Number.isFinite(u)){coins[i].qty=String(q);coins[i].usd=u;persist();render();$('overlay').classList.remove('open');toast('Token updated')}}if(id==='deleteCoin'){coins.splice(Number(e.target.dataset.index),1);persist();render();$('overlay').classList.remove('open');toast('Token removed')}});
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{currentTab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));render($('search').value)});document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-nav]').forEach(x=>x.classList.toggle('active',x===b));if(b.dataset.nav==='home'){currentTab='tokens';document.querySelector('[data-tab="tokens"]').click()}else if(b.dataset.nav==='activity')show('Activity','<p>No transactions. This is a simulated wallet.</p>');else{$('searchbar').classList.add('open');$('search').focus();toast('Explore demo tokens')}});render();
// Fixed approximate market reference prices (October 14, 2026). Not live quotes.
const demoPrices={bitcoin:81500,ethereum:2415,solana:104.50,litecoin:59.45};
for(const c of coins){
 if(c.priceId && Object.prototype.hasOwnProperty.call(demoPrices,c.priceId)){
   c.price=demoPrices[c.priceId];
   c.loss='Approx. price · fixed';
   if(!Number.isFinite(Number(c.usd))) c.usd=0;
 }
}
render();
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(err => console.warn('PWA offline support unavailable:', err)));
}
</script></body></html>
